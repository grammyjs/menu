# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow installs Deno and checks the project on Windows, Ubuntu, and macOS.

name: grammY menu

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

jobs:
    backport:
        runs-on: ubuntu-latest
        steps:
            - name: Setup repo
              uses: actions/checkout@v4
              with:
                  persist-credentials: false

            - name: Install dependencies
              run: npm install --ignore-scripts

            - name: Run backporting
              run: npm run build

    format-and-lint:
        runs-on: ubuntu-latest
        steps:
            - name: Setup repo
              uses: actions/checkout@v4
              with:
                  persist-credentials: false

            - uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.x

            - name: Check Format
              run: deno fmt --check

            - name: Lint
              run: deno lint

    check:
        runs-on: ${{ matrix.os }}

        strategy:
            matrix:
                os: [macOS-latest, windows-latest, ubuntu-latest]

        steps:
            - name: Setup repo
              uses: actions/checkout@v4
              with:
                  persist-credentials: false

            - uses: denoland/setup-deno@v2
              with:
                  deno-version: v2.x

            - name: Check types
              run: deno check --allow-import src/mod.ts
